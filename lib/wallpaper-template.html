<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WMO Wettersimulation – __LOCATION_NAME__</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; font-family: system-ui, sans-serif; background-color: #050508; }

    .bg-container {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      /* Liegt im selben Ordner wie diese HTML-Datei (siehe ensureWallpaperBackgroundPhoto()
         in main.js) - beim ersten Lauf mit einem Standardfoto angelegt, kann in
         Admin -> Dateien durch ein eigenes Foto mit demselben Dateinamen ersetzt werden. */
      background: url('__BG_FILENAME__') center/cover no-repeat;
      transition: filter 0.4s ease;
    }

    #weatherCanvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      touch-action: none;
    }

    /* Bedienelemente sind hier nur noch interner Zustand fuer das Skript unten -
       das Wallpaper wird automatisch aus den echten Wetterdaten gesteuert. */
    .ui-panel { display: none; }

    .ui-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    select, input[type="range"] {
      background: rgba(255, 255, 255, 0.12);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 6px 12px;
      border-radius: 6px;
      outline: none;
      font-size: 14px;
      cursor: pointer;
    }
    select option { background: #1e293b; color: white; }
    input[type="range"] { width: 110px; padding: 0; }

    /* Position/Farbe/Groesse/Hintergrund kommen als Inline-Style vom Adapter (siehe
       Admin-Tab "Wallpaper") - hier nur die gemeinsame, konfigurationsunabhaengige
       Optik (Abstand, Ecken, Schatten, Weichzeichnung). */
    .info-overlay {
      position: absolute;
      z-index: 10;
      font-weight: 500;
      text-shadow: 0 1px 4px rgba(0,0,0,0.7);
      padding: 8px 16px;
      border-radius: 8px;
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255,255,255,0.12);
    }

    /* top/bottom kommt als Inline-Style von main.js (buildWallpaperWarningHtml) -
       automatisch gegenueber der Info-Anzeige platziert, damit sich beide nie
       ueberlappen. */
    .warning-banner {
      position: absolute;
      left: 0; right: 0;
      z-index: 11;
      text-align: center;
      font-weight: 700;
      padding: 8px 16px;
      text-shadow: 0 1px 4px rgba(0,0,0,0.8);
      background: rgba(0,0,0,0.35);
      backdrop-filter: blur(4px);
    }

    #moonIcon {
      position: absolute;
      width: 42px; height: 42px;
      transform: translate(-50%, -50%);
      z-index: 2;
      opacity: 0;
      transition: opacity 1s ease;
      filter: drop-shadow(0 0 6px rgba(255,255,255,0.4));
    }

    .carousel-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 12;
      width: 44px; height: 44px;
      border-radius: 50%;
      border: none;
      background: rgba(15, 23, 42, 0.35);
      color: rgba(255,255,255,0.75);
      font-size: 22px;
      line-height: 44px;
      text-align: center;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease;
    }
    .carousel-arrow:hover { background: rgba(15, 23, 42, 0.6); color: #fff; }
    .carousel-arrow.prev { left: 16px; }
    .carousel-arrow.next { right: 16px; }
  </style>
</head>
<body>

  <div class="bg-container" id="bg"></div>
  <canvas id="weatherCanvas"></canvas>
  <img id="moonIcon" src="__MOON_ICON_URL__" alt="">

  <div id="warningContainer">__WARNING_HTML__</div>
  <div id="overlayContainer">__OVERLAY_HTML__</div>

  <!-- Nur sichtbar/aktiv, wenn im Admin-Tab "Wallpaper" das Karussell aktiviert ist
       und mehr als ein Ort konfiguriert ist (siehe Skript unten). -->
  <button class="carousel-arrow prev" id="carouselPrev" style="display:none;">‹</button>
  <button class="carousel-arrow next" id="carouselNext" style="display:none;">›</button>

  <div class="ui-panel">
    <div class="ui-group">
      <label for="wmoSelect"><strong>WMO Wetterlage:</strong></label>
      <select id="wmoSelect">
        <option value="0">00: Klarer Himmel (Sonnenblenden & Sterne)</option>
        <option value="2">01-03: Bewölkt (Dynamische Wolkenfelder)</option>
        <option value="45">45/48: Nebel (Spürbare Strömung)</option>
        <option value="51">51-55: Leichtes Nieseln</option>
        <option value="63">61-65: Regenschauer / Starkregen</option>
        <option value="73">71-75: Schneefall</option>
        <option value="95">95: Gewitter mit Regen</option>
        <option value="99">99: Schweres Gewitter / Sturm</option>
      </select>
    </div>

    <div class="ui-group">
      <label for="timeSlider"><strong>Tageszeit:</strong></label>
      <input type="range" id="timeSlider" min="0" max="100" value="50">
    </div>
  </div>

  <script>
    const canvas = document.getElementById('weatherCanvas');
    const ctx = canvas.getContext('2d');
    const bg = document.getElementById('bg');
    const wmoSelect = document.getElementById('wmoSelect');
    const timeSlider = document.getElementById('timeSlider');

    let width, height;
    let particles = [];
    let fogParticles = [];
    let stars = [];
    let currentWMO = 0;
    // Reale Werte statt fest programmierter Annahmen - siehe computeWallpaperValues()
    // in main.js: windDrift (Ost/West-Drift aus echter Windrichtung/-staerke),
    // precipScale (Partikelzahl aus echter Niederschlagsmenge), sun/moon (echte
    // Position aus SunCalc statt einer kuenstlichen Animation).
    let windDrift = 0;
    let precipScale = 1;
    let sunPos = { x: 0.78, y: 0.22, visible: true };
    let moonPos = { x: 0.2, y: 0.18, visible: false };

    let animTime = 0;
    let flashOpacity = 0;
    let flashTimer = 0;
    let lightningPath = [];

    const pointer = { x: -1000, y: -1000, active: false };

    function updatePointer(e) {
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      pointer.x = clientX;
      pointer.y = clientY;
      pointer.active = true;
    }

    function handleLightningTap(e) {
      if (e.target.closest && e.target.closest('.ui-panel')) return;

      if ([95, 99].includes(currentWMO)) {
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        flashOpacity = Math.random() * 0.22 + 0.12;
        lightningPath = generateLightning(clientX);
      }
    }

    window.addEventListener('mousemove', updatePointer);
    window.addEventListener('touchstart', (e) => { updatePointer(e); handleLightningTap(e); }, { passive: true });
    window.addEventListener('mousedown', handleLightningTap);
    window.addEventListener('touchmove', updatePointer, { passive: true });
    window.addEventListener('touchend', () => pointer.active = false);
    window.addEventListener('mouseup', () => pointer.active = false);
    window.addEventListener('mouseleave', () => pointer.active = false);

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      initStars();
      initWeather();
    }
    window.addEventListener('resize', resize);

    function resetFlashTimer() {
      flashTimer = Math.floor(Math.random() * 360) + 180;
    }

    function initStars() {
      stars = [];
      const starCount = 140;
      for (let i = 0; i < starCount; i++) {
        stars.push({
          x: Math.random() * width,
          y: Math.random() * (height * 0.25), // Nur in den oberen 25 % des Himmels
          size: Math.random() * 1.4 + 0.4,
          baseAlpha: Math.random() * 0.6 + 0.3,
          twinkleSpeed: Math.random() * 2 + 1,
          phase: Math.random() * Math.PI * 2
        });
      }
    }

    function updateLightingFilter() {
      const timeVal = parseInt(timeSlider.value) / 100;
      let brightness = 0.15 + timeVal * 0.95;
      let sepia = (1 - timeVal) * 35;

      if (currentWMO === 0) brightness *= 1.15;
      else if (currentWMO === 2) brightness *= 0.9;
      else if (currentWMO === 45) brightness *= 0.85;
      else if (currentWMO === 51) brightness *= 0.8;
      else if (currentWMO === 63) brightness *= 0.7;
      else if (currentWMO === 73) brightness *= 0.9;
      else if ([95, 99].includes(currentWMO)) brightness *= 0.6;

      bg.style.filter = `brightness(${brightness.toFixed(2)}) contrast(1.05) sepia(${sepia.toFixed(0)}%)`;
    }

    function initWeather() {
      particles = [];
      fogParticles = [];
      currentWMO = parseInt(wmoSelect.value);
      resetFlashTimer();
      updateLightingFilter();

      let count = 0;
      if (currentWMO === 51) count = 150;
      else if (currentWMO === 63) count = 400;
      else if (currentWMO === 73) count = 250;
      else if (currentWMO === 95) count = 550;
      else if (currentWMO === 99) count = 850;
      // Echte Niederschlagsmenge skaliert die Partikelzahl (precipScale, siehe oben) -
      // gedeckelt, damit es auf schwaecheren Geraeten nicht zu viele werden.
      count = Math.min(1200, Math.round(count * precipScale));

      for (let i = 0; i < count; i++) {
        particles.push(createParticle(currentWMO));
      }

      if (currentWMO === 2) {
        for (let i = 0; i < 18; i++) {
          fogParticles.push({
            x: Math.random() * (width + 600) - 300,
            y: Math.random() * (height * 0.4),
            r: Math.random() * 180 + 120,
            vx: Math.random() * 0.8 + 0.4 + windDrift * 0.15,
            phase: Math.random() * Math.PI * 2,
            alpha: Math.random() * 0.2 + 0.08
          });
        }
      }

      if (currentWMO === 45) {
        for (let i = 0; i < 22; i++) {
          fogParticles.push({
            x: Math.random() * (width + 600) - 300,
            y: Math.random() * height,
            r: Math.random() * 280 + 180,
            vx: Math.random() * 1.2 + 0.6 + windDrift * 0.15,
            phase: Math.random() * Math.PI * 2,
            alpha: Math.random() * 0.12 + 0.05
          });
        }
      }
    }

    function createParticle(wmo) {
      const isSnow = wmo === 73;
      const isStorm = wmo === 99 || wmo === 95;
      // Basiswert wie im Original + echte Windrichtung/-staerke (windDrift, siehe oben) -
      // bei Regen/Schnee weniger stark durchschlagend als bei Sturm, damit sich der
      // Charakter der Wetterlage nicht komplett aendert, nur realistisch mitschwingt.
      const windAngle = (isStorm ? -14 : (isSnow ? -2 : -4)) + windDrift * (isStorm ? 1 : 0.5);

      return {
        x: Math.random() * (width + 600) - 300,
        y: Math.random() * height,
        length: isSnow ? Math.random() * 3 + 2 : Math.random() * 22 + 10,
        speed: isSnow ? Math.random() * 1.5 + 0.8 : (isStorm ? Math.random() * 26 + 18 : Math.random() * 14 + 8),
        wind: windAngle + (Math.random() - 0.5),
        opacity: Math.random() * 0.5 + 0.2,
        size: isSnow ? Math.random() * 3 + 1 : Math.random() * 1.5 + 0.5,
        sway: Math.random() * 0.04
      };
    }

    function generateLightning(targetX) {
      let path = [];
      let currentX = targetX !== undefined ? targetX : (Math.random() * (width - 200) + 100);
      let currentY = 0;
      path.push({x: currentX, y: currentY});

      while (currentY < height * 0.65) {
        currentY += Math.random() * 30 + 10;
        currentX += (Math.random() - 0.5) * 40;
        path.push({x: currentX, y: currentY});
      }
      return path;
    }

    function drawStars() {
      const timeVal = parseInt(timeSlider.value) / 100;
      if (timeVal > 0.4 || ![0, 2, 73].includes(currentWMO)) return;

      const nightFactor = (0.4 - timeVal) / 0.4;

      stars.forEach(s => {
        const twinkle = Math.sin(animTime * s.twinkleSpeed + s.phase) * 0.35 + 0.65;
        const alpha = s.baseAlpha * twinkle * nightFactor;

        ctx.fillStyle = `rgba(255, 255, 255, ${Math.max(0, alpha)})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    function drawSunGlare() {
      // Nur zeigen, wenn die Sonne laut echter Position (sunPos, siehe oben) auch
      // wirklich ueber dem Horizont steht - statt nur nach der kuenstlichen Tageszeit
      // zu gehen, die bei "klarer Himmel" auch fuer klare Naechte gilt.
      if (!sunPos.visible) return;
      const timeVal = parseInt(timeSlider.value) / 100;
      if (timeVal < 0.2) return;

      const sunOpacity = Math.min(1, (timeVal - 0.2) / 0.5);

      // Echte Position (sunPos.x/y, 0-1) statt kuenstlicher Drift - leichtes Zittern
      // (animTime-Anteil) bleibt fuer etwas Lebendigkeit, aber viel dezenter als vorher.
      const sunX = width * sunPos.x + Math.sin(animTime * 0.5) * 6;
      const sunY = height * sunPos.y + Math.cos(animTime * 0.7) * 4;
      const centerX = width / 2;
      const centerY = height / 2;

      let screenGlare = ctx.createRadialGradient(sunX, sunY, 50, sunX, sunY, width * 0.85);
      screenGlare.addColorStop(0, `rgba(255, 245, 210, ${0.35 * sunOpacity})`);
      screenGlare.addColorStop(0.3, `rgba(255, 220, 160, ${0.15 * sunOpacity})`);
      screenGlare.addColorStop(0.7, `rgba(255, 180, 120, ${0.05 * sunOpacity})`);
      screenGlare.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = screenGlare;
      ctx.fillRect(0, 0, width, height);

      const corePulse = Math.sin(animTime * 2) * 15;
      let coreGrad = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, 200 + corePulse);
      coreGrad.addColorStop(0, `rgba(255, 255, 255, ${0.98 * sunOpacity})`);
      coreGrad.addColorStop(0.15, `rgba(255, 245, 190, ${0.85 * sunOpacity})`);
      coreGrad.addColorStop(0.4, `rgba(255, 200, 120, ${0.35 * sunOpacity})`);
      coreGrad.addColorStop(1, 'rgba(255, 150, 50, 0)');
      ctx.fillStyle = coreGrad;
      ctx.beginPath();
      ctx.arc(sunX, sunY, 220 + corePulse, 0, Math.PI * 2);
      ctx.fill();

      const dx = centerX - sunX;
      const dy = centerY - sunY;

      const drawFlareDisc = (dist, radius, r, g, b, alpha) => {
        const fx = sunX + dx * dist;
        const fy = sunY + dy * dist;
        const currentAlpha = alpha * sunOpacity;
        let fGrad = ctx.createRadialGradient(fx, fy, 0, fx, fy, radius);
        fGrad.addColorStop(0, `rgba(${r}, ${g}, ${b}, ${currentAlpha})`);
        fGrad.addColorStop(0.8, `rgba(${r}, ${g}, ${b}, ${currentAlpha * 0.2})`);
        fGrad.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = fGrad;
        ctx.beginPath();
        ctx.arc(fx, fy, radius, 0, Math.PI * 2);
        ctx.fill();
      };

      drawFlareDisc(0.3, 70, 255, 220, 150, 0.25);
      drawFlareDisc(0.65, 120, 180, 220, 255, 0.18);
      drawFlareDisc(1.05, 45, 255, 180, 220, 0.22);
      drawFlareDisc(1.35, 160, 255, 230, 170, 0.12);
    }

    // Alle Bewegungen sind urspruenglich "pro Frame" statt "pro Sekunde" gerechnet -
    // dadurch sah die Animation je nach tatsaechlicher Framerate des Geraets/Browsers
    // (60Hz/90Hz/120Hz, Drosselung im Hintergrund etc.) unterschiedlich schnell aus.
    // dtScale normalisiert das auf "wie viele 1/60s-Schritte seit dem letzten Frame
    // vergangen sind" (1.0 = genau 60fps, wie im Original angenommen) - alle bisher
    // pro Frame addierten Werte werden jetzt mit dtScale multipliziert, damit sie in
    // echten Sekunden ueberall gleich schnell laufen. Nach einer Pause (Tab im
    // Hintergrund) wird dtScale gekappt, damit Partikel nicht durchs Bild springen.
    let lastFrameTime = null;
    function update(timestamp) {
      if (lastFrameTime === null) {
        lastFrameTime = timestamp;
      }
      const dtScale = Math.min(5, Math.max(0, (timestamp - lastFrameTime) / (1000 / 60)));
      lastFrameTime = timestamp;

      ctx.clearRect(0, 0, width, height);
      animTime += 0.015 * dtScale;

      drawStars();

      if (currentWMO === 0) {
        drawSunGlare();
      }

      if (fogParticles.length > 0) {
        fogParticles.forEach(p => {
          p.x += p.vx * dtScale;
          p.y += Math.sin(animTime * 1.5 + p.phase) * 0.4 * dtScale;

          if (pointer.active) {
            const dx = p.x - pointer.x;
            const dy = p.y - pointer.y;
            const dist = Math.hypot(dx, dy);
            const radius = 220;
            if (dist < radius && dist > 0) {
              const force = (radius - dist) / radius;
              p.x += (dx / dist) * force * 12 * dtScale;
              p.y += (dy / dist) * force * 12 * dtScale;
            }
          }

          const dynamicAlpha = p.alpha + Math.sin(animTime * 2 + p.phase) * 0.02;

          if (p.x - p.r > width) {
            p.x = -p.r * 1.2;
            p.y = Math.random() * (currentWMO === 2 ? height * 0.4 : height);
          }

          let grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r);
          grad.addColorStop(0, `rgba(230, 235, 245, ${Math.max(0, dynamicAlpha)})`);
          grad.addColorStop(0.6, `rgba(220, 225, 235, ${Math.max(0, dynamicAlpha * 0.4)})`);
          grad.addColorStop(1, 'rgba(230, 235, 245, 0)');
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fill();
        });
      }

      ctx.lineWidth = 1.2;
      particles.forEach(p => {
        p.y += p.speed * dtScale;
        p.x += p.wind * dtScale;

        if (currentWMO === 73) {
          p.x += Math.sin(p.y * p.sway) * 0.6 * dtScale;
        }

        if (pointer.active && ![95, 99].includes(currentWMO)) {
          const dx = p.x - pointer.x;
          const dy = p.y - pointer.y;
          const dist = Math.hypot(dx, dy);
          const radius = 120;
          if (dist < radius && dist > 0) {
            const force = (radius - dist) / radius;
            p.x += (dx / dist) * force * 9 * dtScale;
            p.y += (dy / dist) * force * 9 * dtScale;
          }
        }

        if (p.y > height || p.x < -400 || p.x > width + 400) {
          p.y = -20;
          p.x = Math.random() * (width + 600) - 300;
        }

        if (currentWMO === 73) {
          ctx.fillStyle = `rgba(255, 255, 255, ${p.opacity})`;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
        } else {
          ctx.strokeStyle = `rgba(200, 225, 255, ${p.opacity})`;
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(p.x + p.wind * 1.2, p.y + p.length);
          ctx.stroke();
        }
      });

      if ([95, 99].includes(currentWMO)) {
        flashTimer -= dtScale;

        if (flashTimer <= 0) {
          flashOpacity = Math.random() * 0.18 + 0.08;
          lightningPath = generateLightning();
          resetFlashTimer();
        }

        if (flashOpacity > 0) {
          ctx.fillStyle = `rgba(210, 225, 255, ${flashOpacity})`;
          ctx.fillRect(0, 0, width, height);

          if (lightningPath.length > 0) {
            ctx.strokeStyle = `rgba(255, 255, 255, ${flashOpacity * 2.5})`;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(lightningPath[0].x, lightningPath[0].y);
            for (let i = 1; i < lightningPath.length; i++) {
              ctx.lineTo(lightningPath[i].x, lightningPath[i].y);
            }
            ctx.stroke();
          }

          flashOpacity -= 0.015 * dtScale;
        }
      }

      requestAnimationFrame(update);
    }

    wmoSelect.addEventListener('change', initWeather);
    timeSlider.addEventListener('input', updateLightingFilter);

    // ---- Ab hier automatisch generiert ----
    // Startwerte kommen direkt vom ioBroker-Adapter, schon fertig berechnet
    // (WMO-Bucket, Tageszeit-Wert, Info-/Warnungs-Anzeige als fertiges HTML gemaess
    // der Einstellungen im Admin-Tab "Wallpaper", echte Wind-/Sonnen-/Mondwerte) -
    // beim ersten Anzeigen sofort korrekt, kein Warten auf einen ersten fetch().
    const overlayContainer = document.getElementById('overlayContainer');
    const warningContainer = document.getElementById('warningContainer');
    const moonIcon = document.getElementById('moonIcon');

    function applyWallpaperValues(v) {
      wmoSelect.value = String(v.bucket);
      timeSlider.value = String(v.timeValue);
      if (overlayContainer) {
        overlayContainer.innerHTML = v.overlayHtml || '';
      }
      if (warningContainer) {
        warningContainer.innerHTML = v.warningHtml || '';
      }
      windDrift = v.windDrift || 0;
      precipScale = v.precipScale || 1;
      sunPos = { x: v.sunX, y: v.sunY, visible: v.sunVisible };
      moonPos = { x: v.moonX, y: v.moonY, visible: v.moonVisible };
      if (moonIcon) {
        if (v.moonIconUrl) {
          moonIcon.src = v.moonIconUrl;
        }
        moonIcon.style.left = (moonPos.x * 100) + '%';
        moonIcon.style.top = (moonPos.y * 100) + '%';
        // Nur zeigen, wenn der Mond wirklich ueber dem Horizont steht UND es dunkel
        // genug ist (gleiche Schwelle wie die Sterne) - sonst geht er im hellen
        // Himmel unter.
        moonIcon.style.opacity = (moonPos.visible && v.timeValue <= 40) ? '1' : '0';
      }
      initWeather();
    }

    applyWallpaperValues({
      bucket: __WMO_BUCKET__,
      timeValue: __TIME_VALUE__,
      overlayHtml: "__OVERLAY_HTML_JS__",
      warningHtml: "__WARNING_HTML_JS__",
      windDrift: __WIND_DRIFT__,
      precipScale: __PRECIP_SCALE__,
      sunX: __SUN_X__,
      sunY: __SUN_Y__,
      sunVisible: __SUN_VISIBLE__,
      moonIconUrl: "__MOON_ICON_URL__",
      moonX: __MOON_X__,
      moonY: __MOON_Y__,
      moonVisible: __MOON_VISIBLE__,
    });

    resize();
    // requestAnimationFrame statt direktem Aufruf, damit update() gleich beim ersten
    // Mal einen echten Zeitstempel bekommt (fuer dtScale, siehe oben) statt undefined.
    requestAnimationFrame(update);

    // Aktuelle Werte liegen als winzige JSON-Datei im selben Ordner (schreibt der
    // Adapter bei jedem Wetter-Update neu) - per fetch() im selben Ordner geholt,
    // kein REST-API-Adapter noetig, kein voller Seiten-Reload noetig. Funktioniert
    // sowohl direkt per URL im Browser/Tablet als auch eingebettet in ein Widget.
    // currentDataFilename/currentBgFilename statt der festen Platzhalter direkt, damit
    // das Karussell (siehe unten) nach dem Wechsel zu einem anderen Ort auch weiterhin
    // dessen Daten aktualisiert statt immer wieder auf den Startort zurueckzuspringen.
    let currentDataFilename = "__DATA_FILENAME__";
    const WALLPAPER_REFRESH_MINUTES = 5;
    async function refreshWallpaperData() {
      try {
        const res = await fetch(currentDataFilename, { cache: 'no-store' });
        const data = await res.json();
        applyWallpaperValues(data);
      } catch (e) {
        console.error('Wallpaper-Daten konnten nicht aktualisiert werden:', e);
      }
    }
    setInterval(refreshWallpaperData, WALLPAPER_REFRESH_MINUTES * 60 * 1000);

    // ---- Karussell zwischen mehreren Orten (optional, Admin-Tab "Wallpaper") ----
    // Manifest liegt im selben Ordner (_locations.json, von main.js bei jedem vollen
    // Update-Zyklus neu geschrieben) - listet alle konfigurierten Orte mit id+Namen.
    const CAROUSEL_ENABLED = __CAROUSEL_ENABLED__;
    const CURRENT_LOCATION_ID = "__LOCATION_ID__";
    const carouselPrevBtn = document.getElementById('carouselPrev');
    const carouselNextBtn = document.getElementById('carouselNext');
    let carouselLocations = [];
    let carouselIndex = 0;

    async function navigateCarousel(dir) {
      if (carouselLocations.length === 0) return;
      carouselIndex = (carouselIndex + dir + carouselLocations.length) % carouselLocations.length;
      const target = carouselLocations[carouselIndex];
      currentDataFilename = `${target.id}-data.json`;
      bg.style.background = `url('${target.id}.jpg') center/cover no-repeat`;
      document.title = 'WMO Wettersimulation – ' + target.name;
      await refreshWallpaperData();
    }

    async function initCarousel() {
      if (!CAROUSEL_ENABLED) return;
      try {
        const res = await fetch('_locations.json', { cache: 'no-store' });
        carouselLocations = await res.json();
      } catch (e) {
        console.error('Karussell-Manifest konnte nicht geladen werden:', e);
        return;
      }
      // Bei nur einem Ort gibt es nichts zum Durchblaettern.
      if (!Array.isArray(carouselLocations) || carouselLocations.length <= 1) return;
      const selfIndex = carouselLocations.findIndex(l => l.id === CURRENT_LOCATION_ID);
      carouselIndex = selfIndex >= 0 ? selfIndex : 0;
      carouselPrevBtn.style.display = 'block';
      carouselNextBtn.style.display = 'block';
      carouselPrevBtn.addEventListener('click', () => navigateCarousel(-1));
      carouselNextBtn.addEventListener('click', () => navigateCarousel(1));
    }
    initCarousel();

    // ---- Versteckter Testmodus (kein UI-Schalter, nicht dokumentiert): an die URL
    // "?wmotest=1" anhaengen, um alle 5s zyklisch durch alle WMO-Buckets zu schalten -
    // zum schnellen Durchschauen aller Wetterlagen ohne auf echte Aenderungen zu warten. ----
    const testParams = new URLSearchParams(location.search);
    if (testParams.get('wmotest') === '1') {
      const testBuckets = [0, 2, 45, 51, 63, 73, 95, 99];
      let testIndex = 0;
      setInterval(() => {
        wmoSelect.value = String(testBuckets[testIndex % testBuckets.length]);
        testIndex++;
        initWeather();
      }, 5000);
    }
  </script>
</body>
